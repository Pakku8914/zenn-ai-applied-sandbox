# 中間プロジェクト1 専用の Alembic 設定。api コンテナの /app で実行する：
#   docker compose exec api alembic -c src/mid01/alembic.ini upgrade head
# 接続先（パスワードを含む）はここに書かず、env.py が環境変数 DATABASE_URL から読む。

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
