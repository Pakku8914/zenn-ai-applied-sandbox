# Session 6：リバースプロキシのバッファリングを再現する nginx の設定
# 起動：docker compose --profile proxy up -d nginx（ホストの 8716 → コンテナの 80）
server {
    listen 80;

    # compose の DNS。api が後から起動・再作成されても名前を引き直せるよう、変数で proxy_pass する
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8000;

    # 本番でよく有効にされる応答の圧縮。圧縮はある程度ためてから送るので、SSE の差分が最後にまとめて届く。
    # nginx 1.28 では proxy_buffering on（既定）だけだと小さな差分はそのまま流れたため、これでバッファリングを再現する。
    # 応答ヘッダ X-Accel-Buffering: no が付いた応答は、圧縮しながらも差分ごとに送り出される（2026-10-02 実測）
    gzip on;
    gzip_types text/event-stream;
    gzip_min_length 0;

    location / {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # SSE は黙っている時間がある。fastapi.sse の 15 秒の : ping より長くしておく
        proxy_read_timeout 60s;
        # proxy_buffering は既定の on のまま
    }
}
