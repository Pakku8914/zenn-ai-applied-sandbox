name: ai-backend-sandbox

# ホストへ公開するのは api（8710）だけ。postgres・redis・mockllm は compose のネットワーク内からだけ使う。
# 実際の Claude API を試すときだけ .env に ANTHROPIC_BASE_URL と ANTHROPIC_API_KEY を書く（.env.example 参照）。

x-app: &app
  build: .
  image: ai-backend-sandbox-app:1.0.0
  volumes:
    - .:/app
  environment:
    ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-http://mockllm:8080}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-mock-key}
    OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://mockllm:8080/v1}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-mock-key}
    # プロバイダ差し替え層（Session 4〜）：上流を anthropic / openai から選ぶ。OPENAI_MODEL が空なら LLM_MODEL を使う
    LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
    OPENAI_MODEL: ${OPENAI_MODEL:-}
    LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5-5}
    LLM_MODEL_LIGHT: ${LLM_MODEL_LIGHT:-claude-haiku-4-5}
    DATABASE_URL: postgresql+asyncpg://kondate:kondate@postgres:5432/kondate
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    MOCKLLM_URL: http://mockllm:8080
    API_BASE_URL: http://api:8000
    DATA_DIR: /app/data
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    mockllm:
      condition: service_healthy

services:
  api:
    <<: *app
    # APP_MODULE を変えると、セッションごとのアプリに差し替えて起動できる（例：src.session05.app:app）
    command: ["sh", "-c", "exec uvicorn ${APP_MODULE:-kondate.main:app} --host 0.0.0.0 --port 8000 --reload --reload-dir kondate --reload-dir src"]
    ports:
      - "8710:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 30s
      start_interval: 500ms

  worker:
    <<: *app
    command: ["celery", "-A", "kondate.worker", "worker", "--loglevel=INFO", "--concurrency=2"]
    # 自分自身（celery@ホスト名）が ping に応答するか。--wait がここまで待つので、起動直後の疎通確認が安定する
    healthcheck:
      test: ["CMD-SHELL", "celery -A kondate.worker inspect ping -d celery@$$HOSTNAME --timeout 3 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 2s

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: kondate
      POSTGRES_PASSWORD: kondate
      POSTGRES_DB: kondate
    volumes:
      # PostgreSQL 18 の公式イメージは PGDATA が /var/lib/postgresql/18/docker。マウント先は /var/lib/postgresql にする
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kondate -d kondate"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 30s
      start_interval: 500ms

  redis:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 10s
      start_interval: 500ms

  mockllm:
    build: ./mockllm
    image: ai-series-mockllm:1.0.0
    environment:
      MOCKLLM_TTFT_MS: "0"
      MOCKLLM_TPS: "0"
    # ports は書かない（ホストへ公開しない）。healthcheck は Dockerfile に内蔵

  # Session 6：リバースプロキシのバッファリングを再現する。profiles を付けたので、既定の up では起動しない
  #   docker compose --profile proxy up -d nginx   → http://localhost:8716 が api の前に立つ
  nginx:
    image: nginx:1.28.0-alpine
    profiles: [proxy]
    volumes:
      - ./src/session06/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8716:80"

  # Session 16：本番用イメージ（マルチステージ・非 root・--reload なし）。profiles を付けたので、既定の up では起動しない
  #   docker compose --profile prod up -d --build --wait api-prod   → http://localhost:8719
  # ソースはバインドマウントしない（イメージに焼き込む）。コードを変えたら --build で作り直す
  # 上流は課金の無い mockllm に固定している（.env の ANTHROPIC_* は読まない）
  api-prod:
    build:
      context: .
      dockerfile: src/session16/Dockerfile.prod
    image: ai-backend-sandbox-prod:1.0.0
    profiles: [prod]
    environment:
      DATABASE_URL: postgresql+asyncpg://kondate:kondate@postgres:5432/kondate
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_BASE_URL: http://mockllm:8080
      ANTHROPIC_API_KEY: mock-key
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5-5}
      WEB_WORKERS: ${WEB_WORKERS:-2}
      MAX_STREAMS_PER_WORKER: ${MAX_STREAMS_PER_WORKER:-100}
      # 演習で待ち時間を短くするための値（本番の目安は本文を参照）。DRAIN < GRACEFUL < stop_grace_period の順
      DRAIN_GRACE_SECONDS: "5"
      GRACEFUL_TIMEOUT_SECONDS: "8"
      EXPOSE_WORKER_PID: "true"
    stop_grace_period: 12s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mockllm:
        condition: service_healthy
    ports:
      - "8719:8000"

volumes:
  pgdata:
