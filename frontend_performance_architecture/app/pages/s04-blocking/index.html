<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S04 レンダリングを妨げる版</title>
    <!-- サイト全体の CSS をまるごと head で読む（全体が届くまで最初の描画が止まる） -->
    <link rel="stylesheet" href="/src/sessions/s04/assets/catalog-full.css" />
    <script type="module" src="/src/sessions/s04/blocking/main.tsx"></script>
  </head>
  <body>
    <!-- 擬似的な外部タグを同期で実行する。CSS が届くまで実行されず、終わるまで下の HTML は解析されない -->
    <script>
      (function () {
        var end = performance.now() + 300;
        while (performance.now() < end) {}
      })();
    </script>
    <header class="site-header">
      <h1>商品カタログ</h1>
      <!-- 大きさの指定がなく、しかも画面内の画像に loading="lazy" を付けている -->
      <img class="hero" src="/src/sessions/s04/assets/hero.svg" alt="今週のおすすめ商品" loading="lazy" />
      <p class="lead">今週のおすすめ商品を集めました。下には 2,000 件の商品一覧が並びます。</p>
    </header>
    <div id="root"></div>
  </body>
</html>
