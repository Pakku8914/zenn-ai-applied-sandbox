<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S06 描画の実験台（価格バーとカートパネル）</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; color: #1f2937; background: #ffffff; }
      .lab { padding: 24px; }
      .controls { display: flex; gap: 8px; }
      .bars { list-style: none; margin: 0; padding: 0; width: 960px; }
      /* 行の高さは固定。contain の有無で見た目が変わらないようにしてある */
      .bar-row { display: flex; align-items: center; gap: 12px; height: 40px; box-sizing: border-box; border-bottom: 1px solid #ddd; }
      /* 実験で付け外しする封じ込め。size と layout を含むので、行の中の変化が行の外へ広がらない */
      .bars.contained .bar-row { contain: strict; }
      .bar-name { width: 120px; flex: none; }
      .bar-price { width: 80px; flex: none; text-align: right; }
      /* 枠の幅は中のバーに左右されない（min-width: 0 と overflow: hidden） */
      .bar-track { flex: 1 1 0; min-width: 0; overflow: hidden; height: 12px; background: #f3f4f6; }
      .bar { display: block; height: 100%; width: 0; background: #2563eb; }
      .bar.narrow { background: #f59e0b; }
      .bar-stock { width: 72px; flex: none; color: #666666; }
      .cart-panel {
        position: fixed; top: 0; right: 0; width: 320px; height: 100vh; box-sizing: border-box;
        padding: 24px; background: #ffffff; box-shadow: -4px 0 16px rgb(0 0 0 / 0.15);
        transform: translateX(100%);
      }
    </style>
    <script type="module" src="/src/sessions/s06/lab/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
