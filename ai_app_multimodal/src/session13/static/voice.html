<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>こんだてAI ― 声で相談</title>
<style>
  body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
  button { font-size: 1rem; padding: .4rem 1rem; }
  .label { color: #666; font-size: .9rem; }
  .notice { border: 1px solid #ccc; border-radius: .5rem; padding: .5rem 1rem; background: #fafafa; }
  #error { color: #b00020; }
  #credit { color: #666; font-size: .85rem; }
</style>
</head>
<body>
<h1>こんだてAI ― 声で相談</h1>

<!-- S13：マイクを使う前に、何に使い・何を残すかを説明する（ブラウザの許可ダイアログより先に読めるように） -->
<section class="notice" id="mic-notice">
  <p><strong>マイクの使い方について</strong></p>
  <ul>
    <li>「話しはじめる」を押すと、ブラウザがマイクの使用の許可を求めます。声は、話した内容を文字にして返事を作るためだけに使います。</li>
    <li>声と文字起こしは、<strong>既定では保存しません</strong>。サーバーの記録（ログ）にも、話した内容は残しません。</li>
    <li>下のチェックを入れたときだけ、話した部分の音声を<strong>7日間</strong>保存し、その後は自動で削除します（聞き取りの改善の確認に使います）。</li>
    <li>保存したものは「自分のデータを削除する」で、いつでも消せます。</li>
  </ul>
  <p>
    <label><input type="checkbox" id="store-audio"> 音声の保存に同意する（7日で自動削除）</label>
  </p>
</section>

<p>
  <button id="start">話しはじめる</button>
  <button id="stop" disabled>終わる</button>
  <span id="state">待機中</span>
</p>
<p class="label" id="storage"></p>
<p><span class="label">あなた：</span><span id="you"></span></p>
<p><span class="label">こんだてAI：</span><span id="reply"></span></p>
<p class="label" id="latency"></p>
<p id="error"></p>
<p id="credit"></p>
<p>
  <button id="forget">自分のデータを削除する</button>
  <span class="label" id="forgotten"></span>
</p>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let ws = null, micStream = null, micCtx = null, playCtx = null;
let ready = false;
let muted = false;
let pendingAudio = null;
let playChain = Promise.resolve();
let nextPlayAt = 0;
let unmuteTimer = 0;

$("start").onclick = async () => {
  $("error").textContent = "";
  micCtx = new AudioContext();
  playCtx = playCtx || new AudioContext();
  await playCtx.resume();
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1 } });
  } catch (e) {
    $("error").textContent = `マイクを使えません（${e.name}）。http://localhost:8720/ で開いているか、ブラウザの許可を確かめてください`;
    micCtx.close();
    return;
  }
  await micCtx.audioWorklet.addModule("/static/pcm-worklet.js");
  const source = micCtx.createMediaStreamSource(micStream);
  const sender = new AudioWorkletNode(micCtx, "pcm-sender");
  source.connect(sender);
  sender.connect(micCtx.destination);

  // S13：同意の有無を start に載せる。チェックが無ければ store_audio は false（＝保存しない）
  const storeAudio = $("store-audio").checked;
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${scheme}://${location.host}/ws/voice`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => ws.send(JSON.stringify({ type: "start", sample_rate: 16000, store_audio: storeAudio }));
  ws.onmessage = (e) => onMessage(e.data);
  ws.onclose = (e) => { $("state").textContent = `切断しました（${e.code}）`; cleanup(); };
  sender.port.onmessage = (e) => {
    if (ready && !muted && ws.readyState === WebSocket.OPEN) ws.send(e.data);
  };
  $("store-audio").disabled = true;     // 話している途中で同意を変えない（変えるなら一度終えてから）
  $("start").disabled = true;
  $("stop").disabled = false;
};

$("stop").onclick = () => {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "stop" }));
};

// S13：自分のデータを消す（本番では x-user-id ではなく①の認証で本人を決める）
$("forget").onclick = async () => {
  if (!confirm("アップロードした写真・文書・レシート・保存した音声・利用記録を削除します。よろしいですか？")) return;
  const res = await fetch("/api/me/data", { method: "DELETE", headers: { "x-user-id": "u001" } });
  const body = await res.json();
  const d = body.deleted;
  $("forgotten").textContent = res.ok
    ? `削除しました（写真など ${d.uploads}・文書 ${d.documents}・レシート ${d.receipts}・音声 ${d.voice}・利用記録 ${d.usage}）`
    : body.error.message;
};

function onMessage(data) {
  if (typeof data !== "string") {
    if (pendingAudio) enqueuePlay(data);
    pendingAudio = null;
    return;
  }
  const msg = JSON.parse(data);
  switch (msg.type) {
    case "ready":
      ready = true;
      // VOICEVOX のクレジットと、返事の声が合成音声であることを必ず表示する
      $("credit").textContent = `返事の声は合成音声です（${msg.credit}）`;
      // サーバーが受け付けた保存の扱いを表示する（画面とサーバーの食い違いに気づけるように）
      $("storage").textContent = msg.store_audio
        ? "音声の保存：する（7日で自動削除）"
        : "音声の保存：しない";
      $("state").textContent = "聞いています";
      break;
    case "vad":
      if (msg.state === "speech_start") {
        $("state").textContent = "話しています…";
      } else {
        $("state").textContent = "考えています…";
        muted = true;
        $("you").textContent = "";
        $("reply").textContent = "";
      }
      break;
    case "transcript":
      $("you").textContent = msg.text;
      break;
    case "reply_delta":
      $("reply").textContent += msg.text;
      break;
    case "audio":
      pendingAudio = msg;
      break;
    case "turn_end":
      showLatency(msg.latency_ms);
      unmuteAfterPlayback();
      break;
    case "error":
      $("error").textContent = `${msg.error.message}（${msg.error.request_id}）`;
      unmuteAfterPlayback();
      break;
  }
}

function enqueuePlay(wav) {
  playChain = playChain.then(async () => {
    const buffer = await playCtx.decodeAudioData(wav);
    const node = playCtx.createBufferSource();
    node.buffer = buffer;
    node.connect(playCtx.destination);
    const at = Math.max(playCtx.currentTime, nextPlayAt);
    node.start(at);
    nextPlayAt = at + buffer.duration;
  });
}

function unmuteAfterPlayback() {
  playChain = playChain.then(() => {
    const waitMs = Math.max(0, nextPlayAt - playCtx.currentTime) * 1000 + 300;
    clearTimeout(unmuteTimer);
    unmuteTimer = setTimeout(() => { muted = false; $("state").textContent = "聞いています"; }, waitMs);
  });
}

function showLatency(lat) {
  const ms = (v) => (v === null ? "－" : `${v}ms`);
  $("latency").textContent =
    `VAD ${ms(lat.vad)} ／ 認識 ${ms(lat.stt)} ／ LLM（最初の文）${ms(lat.llm_first_sentence)}` +
    ` ／ 合成（最初の文）${ms(lat.tts_first)} → 最初の音まで ${ms(lat.first_audio)}`;
}

function cleanup() {
  if (micStream) micStream.getTracks().forEach((t) => t.stop());   // マイクを放す（ブラウザの録音中の表示が消える）
  if (micCtx) micCtx.close();
  micStream = micCtx = null;
  ready = muted = false;
  $("store-audio").disabled = false;
  $("start").disabled = false;
  $("stop").disabled = true;
}
</script>
</body>
</html>
