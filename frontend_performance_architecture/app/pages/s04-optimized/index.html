<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S04 読み込みを最適化した版</title>
    <!-- 最初の画面に要るルールだけをインラインで持つ（クリティカル CSS）。外部 CSS を待たずに描ける -->
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; color: #1f2937; background: #ffffff; }
      .site-header { max-width: 960px; margin: 0 auto; padding: 24px 24px 0; }
      .site-header h1 { font-size: 28px; margin: 0 0 12px; }
      .hero { display: block; max-width: 100%; height: auto; border-radius: 12px; }
      .lead { margin: 12px 0 0; line-height: 1.7; }
      #root { max-width: 960px; margin: 0 auto; padding: 0 24px 24px; }
    </style>
    <!-- module スクリプトは defer と同じ扱い。HTML の解析も最初の描画も止めない -->
    <script type="module" src="/src/sessions/s04/optimized/main.tsx"></script>
  </head>
  <body>
    <header class="site-header">
      <h1>商品カタログ</h1>
      <!-- LCP 要素。大きさを指定して場所を確保し、最優先で取得させる。lazy は付けない -->
      <img
        class="hero"
        src="/src/sessions/s04/assets/hero.svg"
        alt="今週のおすすめ商品"
        width="720"
        height="240"
        fetchpriority="high"
      />
      <p class="lead">今週のおすすめ商品を集めました。下には 2,000 件の商品一覧が並びます。</p>
    </header>
    <div id="root"></div>
  </body>
</html>
