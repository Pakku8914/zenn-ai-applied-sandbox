# 認証・認可の実践入門 — 動作確認用サンドボックス
# 使い方: docker compose up -d  →  docker compose exec app bash
name: auth_oauth_oidc_training

services:
  # 認可サーバー（OpenID Provider）。本書のトークンはすべてここが発行する
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      # Keycloak 26 系の管理者初期化変数（25 以前の KEYCLOAK_ADMIN からリネームされている）
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    # 学習用の認可サーバーを外部に晒さないため、ループバックにのみ公開する
    ports:
      # 8080 が使用中の場合はここと ISSUER_PUBLIC / realm の redirectUris を合わせて変更する
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9000:9000"
    healthcheck:
      # このイメージには curl も wget も入っていないため、bash の /dev/tcp で生のソケットを開いて確認する
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; timeout 2 cat <&3 | grep -m1 status | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # 読者がコードを書く場所。RP（クライアント）とリソースサーバーをここで実装する
  app:
    image: node:22.23.2-bookworm-slim
    working_dir: /work
    command: ["sleep", "infinity"]
    environment:
      # コンテナ間はサービス名で解決する。ブラウザからは localhost:8080 を使う
      ISSUER_INTERNAL: http://keycloak:8080/realms/bookstore
      ISSUER_PUBLIC: http://localhost:8080/realms/bookstore
    volumes:
      - ./app:/work
      # node_modules はコンテナ内でのみ生成する（ホスト OS の差異を持ち込まない）
      - app_node_modules:/work/node_modules
    ports:
      # 他の教材のサンドボックスと同時に起動しても衝突しないポートを使う
      - "127.0.0.1:3100:3100"
      - "127.0.0.1:4100:4100"
    depends_on:
      keycloak:
        condition: service_healthy

volumes:
  app_node_modules:
