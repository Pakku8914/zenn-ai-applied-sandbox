# 観察ラボの Web サーバ設定。
# 同じ内容を HTTP(80) と HTTPS(443) の両方で配信し、平文と暗号化を比較できるようにする。

server {
    listen 80;
    listen [::]:80;
    server_name web.lab.example;

    root /usr/share/nginx/html;
    index index.html;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name web.lab.example;

    # certgen サービスが起動時に生成する自己署名証明書を使う
    ssl_certificate     /etc/nginx/certs/web.lab.example.crt;
    ssl_certificate_key /etc/nginx/certs/web.lab.example.key;

    root /usr/share/nginx/html;
    index index.html;
}
