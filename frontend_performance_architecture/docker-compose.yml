# フロントエンド設計とパフォーマンス ― 動作確認用サンドボックス
# 起動: docker compose up -d --wait
# 計測: docker compose run --rm measure npm run measure
name: frontend-performance-architecture

services:
  # 計測対象の SPA（Vite + React + TypeScript）
  app:
    image: node:24.20.0-trixie-slim
    working_dir: /app
    command: >
      sh -c "npm install --no-fund --no-audit &&
             npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./app:/app
      - app_node_modules:/app/node_modules
    networks:
      default:
        aliases:
          # Chrome はドットを含まない単一ラベルのホスト名（app）を HTTPS へ
          # 自動アップグレードしようとして ERR_SSL_PROTOCOL_ERROR になる。
          # ドットを含む別名でアクセスすることで回避する。
          - app.test
    ports:
      - "127.0.0.1:5273:5173"   # dev サーバー（HMR）
    environment:
      # コンテナ内のファイル監視はポーリングでないと Windows/Mac のバインドマウントで取りこぼす
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: development
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30

  # 計測対象は「本番ビルド」。dev サーバーはモジュールを1つずつ配信するため、
  # ネットワークを絞ると数百リクエストの遅延が積み上がり、実際の利用者の体験と乖離する。
  # 本書の計測はすべてこの preview（vite build の成果物）に対して行う。
  preview:
    image: node:24.20.0-trixie-slim
    working_dir: /app
    command: >
      sh -c "npm run build &&
             npm run preview"
    volumes:
      - ./app:/app
      - app_node_modules:/app/node_modules
    networks:
      default:
        aliases:
          - preview.test
    ports:
      - "127.0.0.1:4273:4173"
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 40
    depends_on:
      # app が npm install を終えるのを待つ（同じ node_modules を共有するため）
      app:
        condition: service_healthy

  # Core Web Vitals とレンダリング性能を測る側。Chromium 入りのイメージを使う
  measure:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /measure
    volumes:
      - ./measure:/measure
      - measure_node_modules:/measure/node_modules
    environment:
      # 計測対象（本番ビルド）
      TARGET_URL: http://preview.test:4173
      # 開発サーバー（HMR の確認用。計測には使わない）
      DEV_URL: http://app.test:5173
    # 計測は都度実行する。常駐させない
    command: ["sleep", "infinity"]
    depends_on:
      preview:
        condition: service_healthy

  # RSC・Server Actions の章でのみ使う（profiles 指定のため既定では起動しない）
  next:
    image: node:24.20.0-trixie-slim
    profiles: ["next"]
    working_dir: /next
    command: >
      sh -c "npm install --no-fund --no-audit &&
             npm run dev -- --hostname 0.0.0.0 --port 3000"
    volumes:
      - ./next:/next
      - next_node_modules:/next/node_modules
    ports:
      - "127.0.0.1:3300:3000"
    environment:
      WATCHPACK_POLLING: "true"

volumes:
  app_node_modules:
  measure_node_modules:
  next_node_modules:
