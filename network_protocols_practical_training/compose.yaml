name: netlab

# client と certgen は同じイメージ（観察ツール一式入り）を共有する。
# ビルドは client サービスだけが行い（compose のビルド工程は全コンテナ起動より前に完了する）、
# certgen はそのイメージを参照するだけにする（同一タグの二重ビルド衝突を避けるため）。
services:
  # 自己署名CAとサーバ証明書を生成して終了する、一度きりのサービス。
  # web はこの完了を待ってから起動する（証明書がないと nginx が立ち上がらないため）。
  certgen:
    image: netlab-client:1.0
    container_name: netlab-certgen
    entrypoint: ["sh", "/scripts/gen-certs.sh"]
    volumes:
      - ./certs:/certs
      - ./scripts:/scripts:ro
    restart: "no"

  # 内部ゾーン lab.example を提供する観察用 DNS サーバ（CoreDNS）。
  dns:
    image: coredns/coredns:1.11.3
    container_name: netlab-dns
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./dns/Corefile:/etc/coredns/Corefile:ro
    networks:
      labnet:
        ipv4_address: 172.30.0.53

  # HTTP(80) / HTTPS(443) の観察対象となる Web サーバ（Nginx）。
  web:
    image: nginx:1.27-alpine
    container_name: netlab-web
    depends_on:
      certgen:
        condition: service_completed_successfully
    volumes:
      - ./web/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/html:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      labnet:
        ipv4_address: 172.30.0.80

  # 学習者が入るシェル。ここから tcpdump / dig / curl / openssl を実行する。
  client:
    build: ./client
    image: netlab-client:1.0
    container_name: netlab-client
    depends_on:
      - dns
      - web
    cap_add:
      - NET_RAW    # tcpdump でパケットをキャプチャするために必要
      - NET_ADMIN  # ip / ルーティングの観察のために付与
    dns:
      - 172.30.0.53  # 名前解決をラボの CoreDNS に向ける
    command: ["sleep", "infinity"]
    volumes:
      - ./workspace:/workspace
      - ./certs:/lab-certs:ro   # ラボCA(ca.crt)を読み取り、信頼の検証に使う
    networks:
      - labnet

networks:
  labnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
